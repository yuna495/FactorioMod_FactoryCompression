[mod-setting-description]
factory-compression-multiplier=Multiplier used for generated UPS machines and batch recipes.
factory-compression-detailed-logging=Writes generated prototype names and detailed exclusion reasons to the Factorio log.
factory-compression-speed-module-3-count=Number of speed module 3 items required by each generated UPS machine recipe. If the item does not exist, it is omitted.
factory-compression-productivity-module-3-count=Number of productivity module 3 items required by each generated UPS machine recipe. If the item does not exist, it is omitted.
factory-compression-efficiency-module-3-count=Number of efficiency module 3 items required by each generated UPS machine recipe. If the item does not exist, it is omitted.

